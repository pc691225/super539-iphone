
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Super539 授權登入</title>

    <meta name="theme-color" content="#0F1115">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Super539">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>

    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
    </style>
</head>

<body class="bg-slate-950 flex items-center justify-center min-h-screen text-white">

<div class="w-full max-w-sm mx-4 bg-slate-900 p-8 rounded-3xl border border-slate-800">

    <h1 class="text-2xl font-black text-center mb-2 text-amber-500">
        SUPER539
    </h1>

    <p class="text-center text-slate-400 text-sm mb-6">
        雲端分析・會員裝置授權
    </p>

    <!-- 授權檢查提示 -->
    <div id="checkingBox" class="text-center py-6">
        <p class="text-amber-400 font-bold">正在檢查會員授權……</p>
        <p class="text-sm text-slate-400 mt-2">請稍候，不需要重複輸入資料</p>
    </div>

    <!-- 驗證失敗或尚未綁定時才顯示 -->
    <div id="loginForm" hidden>
        <p id="loginMessage" class="text-sm text-slate-300 mb-4">
            請輸入會員資料進行裝置綁定。
        </p>

        <label for="name" class="block text-sm text-slate-300 mb-1">會員姓名</label>
        <input
            id="name"
            autocomplete="name"
            class="w-full mb-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-white"
            placeholder="請輸入會員姓名">

        <label for="phone" class="block text-sm text-slate-300 mb-1">手機號碼</label>
        <input
            id="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            class="w-full mb-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-white"
            placeholder="請輸入手機號碼">

        <label for="serial" class="block text-sm text-slate-300 mb-1">授權序號</label>
        <input
            id="serial"
            autocomplete="off"
            autocapitalize="characters"
            class="w-full mb-6 p-4 rounded-xl bg-slate-950 border border-slate-800 text-white uppercase"
            placeholder="請輸入授權序號">

        <button
            id="loginButton"
            type="button"
            class="w-full bg-amber-500 text-black font-black py-4 rounded-2xl">
            綁定裝置
        </button>

        <button
            id="retryButton"
            type="button"
            class="w-full mt-3 py-3 text-sm text-slate-400">
            重新檢查授權
        </button>
    </div>
</div>

<script>
    function getDeviceId() {
        let id = localStorage.getItem("super539_device_id");

        // 舊版曾使用 app_device_id，保留相容性
        if (!id) {
            id = localStorage.getItem("app_device_id");
        }

        if (!id) {
            id = "S539-" +
                Math.random().toString(36).substring(2, 8).toUpperCase();

            localStorage.setItem("super539_device_id", id);
        } else {
            // 統一保存到目前使用的 key
            localStorage.setItem("super539_device_id", id);
        }

        return id;
    }

    function showLoginForm(message) {
        document.getElementById("checkingBox").hidden = true;
        document.getElementById("loginForm").hidden = false;
        document.getElementById("loginMessage").textContent = message;
    }

    async function checkAutoLogin() {
        const checkingBox = document.getElementById("checkingBox");
        const loginForm = document.getElementById("loginForm");

        checkingBox.hidden = false;
        loginForm.hidden = true;
        checkingBox.innerHTML =
            '<p class="text-amber-400 font-bold">正在檢查會員授權……</p>' +
            '<p class="text-sm text-slate-400 mt-2">請稍候，不需要重複輸入資料</p>';

        if (typeof GAS_URL === "undefined" || !GAS_URL) {
            showLoginForm("找不到 GAS API 網址，請檢查 config.js。");
            return;
        }

        try {
            const url = new URL(GAS_URL);
            url.searchParams.set("action", "check_status");
            url.searchParams.set("deviceId", getDeviceId());

            const response = await fetch(url.toString(), {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const json = await response.json();

            console.log("會員授權檢查結果：", json);

            if (json.status === "success" && json.allowed === true) {
                window.location.replace("./analysis.html");
                return;
            }

            showLoginForm(
                json.message || "此裝置尚未授權，請輸入會員資料進行綁定。"
            );

        } catch (error) {
            console.error("會員授權檢查失敗：", error);
            showLoginForm("目前無法連線驗證會員資格，請確認網路後重新檢查。");
        }
    }

    async function login() {
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const serial = document.getElementById("serial").value.trim().toUpperCase();
        const button = document.getElementById("loginButton");

        if (!name || !phone || !serial) {
            alert("請填寫完整資料");
            return;
        }

        button.disabled = true;
        button.textContent = "正在驗證……";

        try {
            const params = new URLSearchParams({
                action: "login",
                name: name,
                phone: phone,
                serial: serial,
                deviceId: getDeviceId()
            });

            const response = await fetch(
                `${GAS_URL}?${params.toString()}`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const json = await response.json();

            if (json.status === "success") {
                localStorage.setItem("binding_name", name);
                localStorage.setItem("binding_phone", phone);
                localStorage.setItem("binding_serial", serial);

                // 再檢查一次伺服器是否真的認可這台裝置
                await checkAutoLogin();
            } else {
                alert(json.message || "授權驗證失敗");
            }

        } catch (error) {
            console.error("登入失敗：", error);
            alert("連線失敗，請檢查網路或 GAS API 設定。");
        } finally {
            button.disabled = false;
            button.textContent = "綁定裝置";
        }
    }

    document.getElementById("loginButton").addEventListener("click", login);
    document.getElementById("retryButton").addEventListener("click", checkAutoLogin);

    // 每次開啟登入頁都先查詢伺服器
    checkAutoLogin();
</script>

</body>
</html>
